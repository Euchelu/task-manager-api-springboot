spring:
  datasource:
    url: jdbc:h2:mem:taskmanager-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: test-secret-key-for-unit-and-integration-tests-only-not-for-production
    expiration-ms: 3600000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
